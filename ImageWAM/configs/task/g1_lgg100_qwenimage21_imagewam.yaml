# @package _global_
# Qwen-Image-2.1 ImageWAM on the LGG100 Unitree G1 data (paper real-world recipe).
# Same recipe as g1_lgg100_flux2_klein_4b_base_imagewam; only the backbone-bound parts differ.
# 2 GPUs x 4 per GPU x gradient accumulation 8 = effective batch 64.

defaults:
  - override /data: g1_lgg100
  - override /model: imagewam_qwenimage21
  - _self_

data:
  train:
    require_text_cache: false
    qwen_text_cache_dir: ???
    qwen_context_len: 128
    qwen_text_cache_format: qwen3vl_qwenimage21
    # Normalization statistics of the FLUX.2-4B run's training split (plan.md D8), set by the launcher.
    pretrained_norm_stats: ???
  val:
    require_text_cache: false
    qwen_text_cache_dir: ???
    qwen_context_len: 128
    qwen_text_cache_format: qwen3vl_qwenimage21

batch_size: 4
num_workers: 24
prefetch_factor: 2
persistent_workers: true
keep_latest_state_only: true

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 5000
eval_every: 500

gradient_accumulation_steps: 8
weight_decay: 1e-2
max_grad_norm: 1.0
optimizer_max_group_numel: 1000000000  # keep DeepSpeed ZeRO-2 per-rank partitions < 2^31 (ISSUE-008)
mixed_precision: "bf16"
resume: null

model:
  proprio_dim: ${data.train.processor.proprio_output_dim}
  qwen_context_len: 128

# No project wandb identity is configured: log to local offline files under the run directory.
wandb:
  enabled: true
  workspace: null
  project: imagewam
  name: g1_lgg100_qwenimage21_imagewam
  mode: offline
